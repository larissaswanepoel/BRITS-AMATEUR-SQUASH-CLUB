<!DOCTYPE html><html lang="af"><head><meta charset="utf-8"><title>Brits Amateur Squash Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0b1f4b;--mut:#5b6784;--gold:#d9a21b;--line:#e1e6f0;--ok:#1a8f4c;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#121c38;--ink:#eef2ff;--mut:#9aa7c7;--line:#223055}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#121c38;--ink:#eef2ff;--mut:#9aa7c7;--line:#223055}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:78px}
header{background:#0b1f4b;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--gold)}
header img{width:46px;height:46px;border-radius:50%;background:#fff}header b{font-size:17px;line-height:1.15}header small{display:block;color:var(--gold);font-weight:400}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row.me{background:rgba(217,162,27,.25);border-left:5px solid var(--gold);border-radius:10px;padding-left:8px;margin:3px 0;border-top-color:transparent}.row.me .rk{background:var(--gold);color:#0b1f4b}.rk{width:38px;height:38px;border-radius:50%;background:#0b1f4b;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rk.g{background:var(--gold);color:#0b1f4b}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}
button,select,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 14px;background:var(--card);color:var(--ink)}
button{background:#0b1f4b;color:#fff;border:0;font-weight:600;min-height:44px}button.gold{background:var(--gold);color:#0b1f4b}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:6px 12px;min-height:36px;font-size:14px}
.yes{background:#1a8f4c;color:#fff;box-shadow:0 0 0 3px rgba(26,143,76,.3)}.no{background:#c0392b;color:#fff;box-shadow:0 0 0 3px rgba(192,57,43,.3)}.mine{background:var(--gold);color:#0b1f4b;padding:1px 7px;border-radius:6px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}.w{color:var(--ok)}.l{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:10px 1px}details summary{font-weight:700;cursor:pointer;min-height:28px}details ul{padding-left:20px;margin:8px 0 0}details li{margin:7px 0}nav button.on{color:var(--ink);box-shadow:inset 0 3px var(--gold)}
.g5{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}.g5 input{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:22px}

async function finish(c,winner,games,wo){
 const f=(await db.doc('challenges/'+c.id).get()).data();if(!f||!['accepted','pending'].includes(f.status))return;

 if(winner==c.from){const mv=ranked().filter(p=>p.rank>=b.rank&&p.rank<=a.rank);mv.forEach(p=>{before[p.id]=p.rank;after[p.id]=p.id==a.id?b.rank:p.rank+1});
  await Promise.all(mv.map(p=>db.doc('players/'+p.id).update({rank:after[p.id]})))}
 else{before[a.id]=after[a.id]=a.rank;before[b.id]=after[b.id]=b.rank}
 await db.collection('matches').add({type:'Ladder Challenge',p1:c.from,p2:c.to,winner,games:games.map(g=>g.join('-')),walkover:!!wo,date:Date.now(),before,after,challengeId:c.id})}
